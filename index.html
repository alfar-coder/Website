<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Selected work by Álfar Smári, product designer and co-founder of Manneskja.">
    <meta name="theme-color" content="#ffffff">
    <title>Álfar Smári — Selected work</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="preload" href="assets/fonts/SuisseIntl-Book.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script src="background.js" defer></script>
  </head>
  <body>
    <div class="background" aria-hidden="true"><img id="background-image" src="bg.jpg" alt=""></div>
    <main class="stage">
      <section class="portfolio" aria-labelledby="portfolio-name">
        <header class="portfolio-header">
          <h1 id="portfolio-name"><a href="mailto:alfar@manneskja.is">Álfar Smári</a></h1>
        </header>
        <div class="portfolio-body">
          <aside class="sidebar" aria-label="About Álfar">
            <div class="sidebar-section">
              <h2>Co founder of</h2>
              <a class="studio" href="https://manneskja.com" target="_blank" rel="noopener noreferrer">
                <span class="client-icon"><img src="assets/clients/manneskja.png" width="20" height="20" alt=""></span>
                <span>Manneskja</span>
              </a>
            </div>
            <div class="sidebar-section">
              <h2>Recent work includes</h2>
              <ul class="clients" aria-label="Recent clients">
                <li><span class="client-icon client-icon--border"><img src="assets/clients/truffle.png" width="20" height="20" alt=""></span><span>Truffle,</span></li>
                <li><span class="client-icon client-icon--border"><img src="assets/clients/nolla.png" width="20" height="20" alt=""></span><span>Nolla,</span></li>
                <li><span class="client-icon client-icon--border"><img src="assets/clients/vecct.png" width="20" height="20" alt=""></span><span>Vecct,</span></li>
                <li><span class="client-icon client-icon--border"><img src="assets/clients/saint.png" width="20" height="20" alt=""></span><span>Saint,</span></li>
                <li><span class="client-icon client-icon--optivolt"><img src="assets/clients/optivolt.png" width="20" height="20" alt=""></span><span>Optivolt,</span></li>
                <li><span class="client-icon client-icon--light"><img src="assets/clients/piqy.png" width="20" height="20" alt=""></span><span>Piqy,</span></li>
                <li><span class="client-icon client-icon--light"><img src="assets/clients/special-projects.png" width="20" height="20" alt=""></span><span>Special projects,</span></li>
                <li><span class="client-icon client-icon--light client-icon--border"><img src="assets/clients/context.png" width="20" height="20" alt=""></span><span>Context,</span></li>
              </ul>
            </div>
          </aside>
          <div class="gallery" role="region" aria-label="Selected projects — scroll to explore" tabindex="0">
            <a class="project" href="https://manneskja.com/#freepower" target="_blank" rel="noopener noreferrer" aria-label="View FreePower on Manneskja">
              <img src="assets/projects/freepower.webp" width="1280" height="720" alt="FreePower wireless charging website on a desktop display." fetchpriority="high" decoding="async">
            </a>
            <a class="project" href="https://manneskja.com/#optivolt" target="_blank" rel="noopener noreferrer" aria-label="View Optivolt on Manneskja">
              <img src="assets/projects/optivolt.webp" width="1280" height="720" alt="Optivolt solar energy dashboard on iPhone." decoding="async">
            </a>
            <a class="project" href="https://manneskja.com/#nolla-title" target="_blank" rel="noopener noreferrer" aria-label="View Nolla on Manneskja">
              <img src="assets/projects/nolla.webp" width="1280" height="720" alt="Nolla healthcare platform on a desktop display." loading="lazy" decoding="async">
            </a>
            <a class="project" href="https://manneskja.com/#qava" target="_blank" rel="noopener noreferrer" aria-label="View Qava on Manneskja">
              <img src="assets/projects/qava.webp" width="1280" height="720" alt="Qava portfolio and trading interface on iPhone." loading="lazy" decoding="async">
            </a>
          </div>
        </div>
      </section>
    </main>
    <div class="background-tools">
      <p class="background-status" role="status" aria-live="polite"></p>
      <div class="background-actions">
        <button class="background-button" id="background-reset" type="button" hidden>Reset</button>
        <button class="background-button" id="background-upload" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Upload background</span>
        </button>
      </div>
      <input id="background-file" type="file" accept="image/*" hidden>
    </div>
  </body>
</html>
